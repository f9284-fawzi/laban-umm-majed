<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام ملصقات المنتجات المتقدم</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    h1 { text-align: center; }
    input, button { padding: 5px; margin: 5px; }
    .label-sheet { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .label { width: 180px; height: 120px; border: 1px solid #ccc; padding: 5px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 14px; }
    .label svg { margin-top: 5px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    @media print {
        body { background: #fff; }
        .label-sheet { gap: 5px; }
        .label { page-break-inside: avoid; }
        input, button, table { display: none; }
    }
</style>
</head>
<body>
<h1>نظام ملصقات المنتجات المتقدم</h1>

<div>
    <input type="text" id="store" placeholder="اسم المحل">
    <input type="text" id="name" placeholder="اسم المنتج">
    <input type="number" id="price" placeholder="السعر بالريال">
    <input type="number" id="days" placeholder="عدد أيام الصلاحية">
    <input type="number" id="quantity" placeholder="عدد الملصقات">
    <button onclick="addProduct()">إضافة المنتج</button>
    <button onclick="printAll()">طباعة الكل</button>
</div>

<h3>قائمة المنتجات الحالية</h3>
<table>
    <thead>
        <tr>
            <th>اسم المحل</th>
            <th>المنتج</th>
            <th>السعر</th>
            <th>أيام الصلاحية</th>
            <th>عدد الملصقات</th>
            <th>أوامر</th>
        </tr>
    </thead>
    <tbody id="productTable"></tbody>
</table>

<div class="label-sheet" id="labels"></div>

<script>
let products = JSON.parse(localStorage.getItem('products')) || [];

function saveProducts() {
    localStorage.setItem('products', JSON.stringify(products));
}

function addProduct() {
    const store = document.getElementById('store').value;
    const name = document.getElementById('name').value;
    const price = document.getElementById('price').value;
    const days = parseInt(document.getElementById('days').value);
    const quantity = parseInt(document.getElementById('quantity').value);

    if (!store || !name || !price || !days || !quantity) {
        alert('يرجى ملء جميع الحقول');
        return;
    }

    const today = new Date();
    const expiryDate = new Date(today.getTime() + days*24*60*60*1000);
    const expiryStr = expiryDate.toISOString().split('T')[0];

    const product = { store, name, price, days, expiry: expiryStr, quantity };
    products.push(product);
    saveProducts();
    renderProducts();
    renderLabels();
}

function deleteProduct(index) {
    if (confirm('هل تريد حذف هذا المنتج؟')) {
        products.splice(index, 1);
        saveProducts();
        renderProducts();
        renderLabels();
    }
}

function renderProducts() {
    const tbody = document.getElementById('productTable');
    tbody.innerHTML = '';
    products.forEach((p, index) => {
        tbody.innerHTML += `
            <tr>
                <td>${p.store}</td>
                <td>${p.name}</td>
                <td>${p.price}</td>
                <td>${p.days}</td>
                <td>${p.quantity}</td>
                <td>
                    <button onclick="deleteProduct(${index})">حذف</button>
                </td>
            </tr>
        `;
    });
}

function renderLabels() {
    const container = document.getElementById('labels');
    container.innerHTML = '';
    products.forEach((p, index) => {
        for (let i=0; i<p.quantity; i++) {
            const code = Date.now().toString() + Math.floor(Math.random()*1000);
            const div = document.createElement('div');
            div.className = 'label';
            div.innerHTML = `
                <strong>${p.store}</strong>
                <strong>${p.name}</strong>
                <p>${p.price} ريال</p>
                <p>انتهاء: ${p.expiry}</p>
                <svg id="barcode${index}${i}"></svg>
            `;
            container.appendChild(div);
            JsBarcode(`#barcode${index}${i}`, code, { format: "CODE128", width: 2, height: 40 });
        }
    });
}

function printAll() {
    window.print();
}

// عند فتح الصفحة، نعرض المنتجات المخزنة
renderProducts();
renderLabels();
</script>
</body>
</html>
