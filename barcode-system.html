<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام طباعة ملصقات الباركود</title>
    <!-- مكتبة توليد الباركود -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        
        .form-group { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        input, button { padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { cursor: pointer; border: none; transition: 0.3s; }
        .btn-add { background-color: #27ae60; color: white; grid-column: span 2; }
        .btn-add:hover { background-color: #219150; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 30px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #3498db; color: white; }

        /* تنسيق الملصق عند الطباعة */
        .print-area { display: none; }
        @media print {
            body * { visibility: hidden; }
            .print-section, .print-section * { visibility: visible; }
            .print-section { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
            .label-card { 
                width: 60mm; height: 40mm; /* حجم الملصق القياسي */
                border: 1px solid #000; margin: 10px auto; padding: 5px; 
                text-align: center; page-break-inside: avoid;
            }
            .label-card h3 { margin: 5px 0; font-size: 14px; }
            .label-card p { margin: 2px 0; font-size: 12px; }
            svg { width: 100%; max-height: 50px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>نظام إدارة وطباعة الباركود</h2>
    
    <div class="form-group">
        <input type="text" id="shopName" placeholder="اسم المحل" value="ألبان أم ماجد">
        <input type="text" id="productName" placeholder="اسم المنتج">
        <input type="number" id="price" placeholder="السعر">
        <input type="date" id="prodDate">
        <button class="btn-add" onclick="addProduct()">إضافة المنتج وحفظه</button>
    </div>

    <table id="productTable">
        <thead>
            <tr>
                <th>المنتج</th>
                <th>السعر</th>
                <th>الإنتاج</th>
                <th>الانتهاء</th>
                <th>الباركود</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    
    <button onclick="window.print()" style="margin-top:20px; background:#34495e; color:white; width:100%;">طباعة الملصقات المختارة</button>
</div>

<!-- منطقة المعاينة قبل الطباعة -->
<div id="printArea" class="print-area print-section"></div>

<script>
    // تحديد تاريخ اليوم تلقائياً
    document.getElementById('prodDate').valueAsDate = new Date();

    function addProduct() {
        const shop = document.getElementById('shopName').value;
        const name = document.getElementById('productName').value;
        const price = document.getElementById('price').value;
        const pDate = new Date(document.getElementById('prodDate').value);
        
        if(!name || !price) { alert("يرجى ملء كافة الحقول"); return; }

        // حساب تاريخ الانتهاء (بعد 7 أيام)
        const eDate = new Date(pDate);
        eDate.setDate(pDate.getDate() + 7);
        
        const prodStr = pDate.toLocaleDateString('en-GB');
        const expStr = eDate.toLocaleDateString('en-GB');
        const barcodeValue = Date.now().toString().slice(-8); // توليد رقم باركود فريد

        // إضافة للجدول
        const table = document.getElementById('productTable').getElementsByTagName('tbody')[0];
        const row = table.insertRow();
        row.innerHTML = `
            <td>${name}</td>
            <td>${price} ريال</td>
            <td>${prodStr}</td>
            <td>${expStr}</td>
            <td><svg id="barcode${barcodeValue}"></svg></td>
            <td><button onclick="deleteRow(this)" style="background:#e74c3c; color:white;">حذف</button></td>
        `;

        // توليد الباركود
        JsBarcode(`#barcode${barcodeValue}`, barcodeValue, {
            format: "CODE128",
            width: 1.5,
            height: 40,
            displayValue: true
        });

        // إضافة لملصقات الطباعة
        const printArea = document.getElementById('printArea');
        const label = document.createElement('div');
        label.className = 'label-card';
        label.innerHTML = `
            <h3>${shop}</h3>
            <p><strong>${name}</strong></p>
            <p>السعر: ${price} ريال</p>
            <p>الإنتاج: ${prodStr} | الانتهاء: ${expStr}</p>
            <svg id="printBar${barcodeValue}"></svg>
        `;
        printArea.appendChild(label);
        
        JsBarcode(`#printBar${barcodeValue}`, barcodeValue, {
            format: "CODE128",
            width: 1.2,
            height: 30
        });

        // مسح الحقول
        document.getElementById('productName').value = "";
        document.getElementById('price').value = "";
    }

    function deleteRow(btn) {
        const row = btn.parentNode.parentNode;
        row.parentNode.removeChild(row);
    }
</script>

</body>
</html>
