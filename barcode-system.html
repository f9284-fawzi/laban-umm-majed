<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملصقات المنتجات</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    h1 { text-align: center; }
    input, button { padding: 5px; margin: 5px; }
    .label-sheet { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .label { width: 180px; height: 100px; border: 1px solid #ccc; padding: 5px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .label svg { margin-top: 5px; }
    @media print {
        body { background: #fff; }
        .label-sheet { gap: 5px; }
        .label { page-break-inside: avoid; }
        input, button { display: none; }
    }
</style>
</head>
<body>
<h1>نظام ملصقات المنتجات</h1>

<div>
    <input type="text" id="name" placeholder="اسم المنتج">
    <input type="number" id="price" placeholder="السعر بالريال">
    <input type="date" id="expiry">
    <button onclick="addProduct()">إضافة المنتج</button>
    <button onclick="printAll()">طباعة الكل</button>
</div>

<div class="label-sheet" id="labels"></div>

<script>
let products = [];

function addProduct() {
    const name = document.getElementById('name').value;
    const price = document.getElementById('price').value;
    const expiry = document.getElementById('expiry').value;

    if (!name || !price || !expiry) {
        alert('يرجى ملء جميع الحقول');
        return;
    }

    const code = Date.now().toString();
    const product = { name, price, expiry, code };
    products.push(product);
    renderLabels();
}

function renderLabels() {
    const container = document.getElementById('labels');
    container.innerHTML = '';
    products.forEach((p, index) => {
        const div = document.createElement('div');
        div.className = 'label';
        div.innerHTML = `
            <strong>${p.name}</strong>
            <p>${p.price} ريال</p>
            <p>انتهاء: ${p.expiry}</p>
            <svg id="barcode${index}"></svg>
        `;
        container.appendChild(div);
        JsBarcode(`#barcode${index}`, p.code, { format: "CODE128", width: 2, height: 40 });
    });
}

function printAll() {
    window.print();
}
</script>
</body>
</html>
