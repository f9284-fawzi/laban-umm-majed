<script>
let products = JSON.parse(localStorage.getItem("products")) || [];
let editIndex = null;

document.getElementById("shopName").value =
localStorage.getItem("shopName") || "";

document.getElementById("shopName").addEventListener("input", function(){
    localStorage.setItem("shopName", this.value);
});

function saveProducts(){
    localStorage.setItem("products", JSON.stringify(products));
}

function addProduct(){
    let name = document.getElementById("name").value;
    let price = document.getElementById("price").value;
    let expiry = document.getElementById("expiry").value;

    if(!name || !price || !expiry){
        alert("عبّ كل البيانات");
        return;
    }

    if(editIndex !== null){
        products[editIndex].name = name;
        products[editIndex].price = price;
        products[editIndex].expiry = expiry;
        editIndex = null;
        document.querySelector(".add-btn").textContent = "إضافة";
    } else {
        products.push({
            name,
            price,
            expiry,
            barcode: Date.now().toString()
        });
    }

    saveProducts();
    renderProducts();

    document.getElementById("name").value="";
    document.getElementById("price").value="";
    document.getElementById("expiry").value="";
}

function editProduct(index){
    let p = products[index];

    document.getElementById("name").value = p.name;
    document.getElementById("price").value = p.price;
    document.getElementById("expiry").value = p.expiry;

    editIndex = index;

    document.querySelector(".add-btn").textContent = "حفظ التعديل";
}

function deleteProduct(index){
    products.splice(index,1);
    saveProducts();
    renderProducts();
}

function printLabel(index){
    let p = products[index];
    let shop = localStorage.getItem("shopName") || "";

    let win = window.open('', '', 'width=400,height=500');

    win.document.write(`
        <html>
        <head>
            <title>طباعة ملصق</title>
            <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"><\/script>
            <style>
                body{
                    font-family:Arial;
                    text-align:center;
                    padding:20px;
                }
                h2{
                    margin-bottom:20px;
                }
            </style>
        </head>
        <body>
            <h2>${shop}</h2>
            <h3>${p.name}</h3>
            <p>السعر: ${p.price} ر.س</p>
            <p>الانتهاء: ${p.expiry}</p>
            <svg id="printBarcode"></svg>

            <script>
                JsBarcode("#printBarcode", "${p.barcode}", {
                    format:"CODE128",
                    width:2,
                    height:60,
                    displayValue:true
                });

                window.onload=function(){
                    window.print();
                }
            <\/script>
        </body>
        </html>
    `);

    win.document.close();
}

function renderProducts(){
    let container = document.getElementById("products");
    container.innerHTML="";

    products.forEach((product,index)=>{
        let div = document.createElement("div");
        div.className="product";

        div.innerHTML=`
            <p><strong>${product.name}</strong></p>
            <p>${product.price} ر.س</p>
            <p>${product.expiry}</p>

            <svg id="barcode${index}"></svg><br>

            <button onclick="editProduct(${index})">تعديل</button>
            <button class="print-btn" onclick="printLabel(${index})">طباعة</button>
            <button class="delete-btn" onclick="deleteProduct(${index})">حذف</button>
        `;

        container.appendChild(div);

        JsBarcode(`#barcode${index}`, product.barcode,{
            format:"CODE128",
            width:2,
            height:50,
            displayValue:true
        });
    });
}

renderProducts();
</script>
