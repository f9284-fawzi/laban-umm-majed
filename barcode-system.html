<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام تسعيرة وطباعة الملصقات</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<style>
body{
font-family:Tahoma,Arial;
background:#f4f6f8;
padding:20px;
margin:0;
}

h1{
text-align:center;
color:#222;
}

.controls{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

input,button{
padding:10px;
margin:5px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
}

button{
background:#007bff;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:#005dc1;
}

.labels{
display:grid;
grid-template-columns:repeat(3, 1fr);
gap:10px;
}

.label{
background:white;
border:1px solid #ddd;
padding:8px;
height:160px;
text-align:center;
display:flex;
flex-direction:column;
justify-content:space-between;
border-radius:6px;
}

.store{
font-size:14px;
font-weight:bold;
}

.product{
font-size:18px;
font-weight:bold;
}

.price{
font-size:16px;
color:green;
font-weight:bold;
}

.expiry{
font-size:12px;
color:#555;
}

svg{
max-width:100%;
height:45px;
}

@media print{
.controls{
display:none;
}
body{
background:white;
padding:0;
}
.labels{
gap:4mm;
}
.label{
page-break-inside:avoid;
height:150px;
}
}
</style>
</head>
<body>

<h1>نظام تسعيرة المنتجات</h1>

<div class="controls">

<input id="store" placeholder="اسم المحل">

<input id="name" placeholder="اسم المنتج">

<input id="price" type="number" placeholder="السعر">

<input id="days" type="number" placeholder="عدد أيام الصلاحية">

<input id="qty" type="number" placeholder="عدد الملصقات">

<button onclick="addProduct()">إضافة</button>

<button onclick="window.print()">طباعة الكل</button>

</div>

<div class="labels" id="labels"></div>

<script>

let products=JSON.parse(localStorage.getItem("products"))||[];

function save(){
localStorage.setItem("products",JSON.stringify(products));
}

function barcodeCode(index){
return "PR"+String(index+1).padStart(6,'0');
}

function addProduct(){

let store=document.getElementById("store").value;
let name=document.getElementById("name").value;
let price=document.getElementById("price").value;
let days=parseInt(document.getElementById("days").value);
let qty=parseInt(document.getElementById("qty").value);

if(!store||!name||!price||!days||!qty){
alert("أكمل جميع البيانات");
return;
}

let d=new Date();
d.setDate(d.getDate()+days);

let expiry=d.toLocaleDateString('en-CA');

products.push({
store,
name,
price,
qty,
expiry
});

save();
render();

}

function render(){

let labels=document.getElementById("labels");
labels.innerHTML="";

let count=0;

products.forEach((p,index)=>{

for(let i=0;i<p.qty;i++){

let code=barcodeCode(index);

let div=document.createElement("div");
div.className="label";

div.innerHTML=`
<div class="store">${p.store}</div>
<div class="product">${p.name}</div>
<div class="price">${p.price} ريال</div>
<div class="expiry">انتهاء: ${p.expiry}</div>
<svg id="b${count}"></svg>
`;

labels.appendChild(div);

JsBarcode(`#b${count}`, code,{
format:"CODE128",
displayValue:true,
height:40,
width:1.6,
fontSize:12
});

count++;

}

});

}

render();

</script>

</body>
</html>
